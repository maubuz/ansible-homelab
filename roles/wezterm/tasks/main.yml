---
- name: Add the WezTerm APT source
  tags: setup
  ansible.builtin.include_role:
    name: apt_source
  vars:
    apt_source_name: wezterm
    apt_source_uri: '{{ wezterm_repo_uri }}'
    # The fury repo is not organised into suites or components; apt accepts the
    # globs and fetches dists/%2a/%2a. Verified against apt 3.2.
    apt_source_suites: '*'
    apt_source_components: '*'
    apt_source_key_url: '{{ wezterm_key_url }}'
    apt_source_keyring: '{{ wezterm_keyring }}'
    apt_source_key_armoured: true

# update_cache is folded in here rather than run as its own task: a bare
# "apt: update_cache" always reports changed (it compares the mtime of
# /var/lib/apt/periodic/update-success-stamp, which every successful update
# touches), so the role could never converge. Here "changed" reflects the
# package operation alone, and the refresh is reported as cache_updated.
#
# state: latest tracks the nightly channel — it publishes most days, so
# "present" would pin whatever version happened to land first.
- name: Install WezTerm # noqa: package-latest
  tags: install
  become: true
  ansible.builtin.apt:
    name: '{{ wezterm_package }}'
    state: latest
    update_cache: true
