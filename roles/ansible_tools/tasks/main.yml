---
# What you need to work *on* this repository, as opposed to what the other
# roles install on the machine. Requires pipx from the python role.
#
# Lint from the repository root: ansible.cfg sets collections_path so the linter
# finds the collections Ubuntu ships inside the ansible package's own tree.
# Without that it reports every community.general and ansible.posix task as an
# unresolvable module.
#
#   ansible-lint playbooks/ roles/ local.yml site.yml
#
# state: latest rather than present, matching uv in the python role. Nothing
# upgrades pipx packages for us — the bootstrap role's system upgrade does not
# reach them — so latest is the only way a linter stays current with the rules
# it enforces. This is not the state: latest that system packages moved away
# from; those are owned by the bootstrap role.
- name: Install ansible-lint with pipx
  community.general.pipx:
    name: ansible-lint
    state: latest
