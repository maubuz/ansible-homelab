---
# Applies to every host in the inventory. Deliberately near-empty: values live
# with the role that uses them (roles/*/defaults/main.yml) unless they genuinely
# differ per host group.

# Public keys for the unattended account (ansiblebot role), one per controller.
# Public keys are not secret. The matching private key stays on the controller.
# Generate one with:
#     ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519_ansiblebot -C "ansiblebot@$(hostname)"
# then paste the contents of the .pub file below.
ansiblebot_keys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINm78pO0pVOicB1iI7DfKGg/GhXx+pDvLvieO2jnDsRt ansiblebot@t14
# Installed on every host type. Each side composes these into its own lists
# (desktop_* in workstations.yml for the desktop role; the server_packages role
# reads them directly), so the two never share a variable name.
baseline_packages:
    - fd-find
    - git-delta
    - fzf
    - bat
    - stow
    - htop
    - ripgrep
    - curl
    # includes gcc compiler, make, and other tools. Used for nvim (tree-sitter et al.)
    - build-essential
    # The distribution's Rust, not rustup. apt keeps these patched; rustup's apt
    # package only updates the installer, so its toolchains go stale until someone
    # runs "rustup update" by hand.
    - rustc
    - cargo
baseline_snaps:
    - nordvpn
baseline_snaps_classic:
    - nvim
# The admin user on servers: the person who administers Syncthing (the
# server_syncthing role, which no playbook applies yet) and so belongs to its service account's group. Set here
# rather than in group_vars/servers.yml because ansible-pull ignores that file.
# The role fails until it is set, and the user must already exist.
server_admin_user: 'mau'
# Users who each get a personal Syncthing instance on a server (their own
# folders and GUI). The users must already exist. Add 'mau' here only if the
# admin wants one too.
server_syncthing_users: []
