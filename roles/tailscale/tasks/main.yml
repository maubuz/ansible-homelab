---
# Deliberately leaves out "tailscale up": that opens a browser for interactive
# auth and is a one-time step per machine, not something a converging role
# should re-run. Do it once by hand after the first install:
#
#     sudo tailscale up
- name: Fail early on a non-Ubuntu host
  ansible.builtin.assert:
    that: ansible_facts.distribution == "Ubuntu"
    fail_msg: >-
      This role targets Ubuntu; Tailscale publishes separate repositories per
      distribution. See https://tailscale.com/kb/1031/install-linux
    quiet: true

- name: Add the Tailscale APT source
  tags: setup
  ansible.builtin.include_role:
    name: apt_source
  vars:
    apt_source_name: tailscale
    apt_source_uri: '{{ tailscale_repo_uri }}'
    apt_source_suites: '{{ tailscale_suite }}'
    apt_source_components: main
    # .noarmor.gpg is already dearmored, so no gpg step, unlike WezTerm's key.
    apt_source_key_url: >-
      {{ tailscale_repo_uri }}/{{ tailscale_suite }}.noarmor.gpg
    apt_source_keyring: '{{ tailscale_keyring }}'
    # Left behind by the 26.04 upgrade when it could not migrate the .list.
    apt_source_legacy_files:
      - tailscale.list.disabled
      - tailscale.list.migrate

- name: Install Tailscale # noqa: package-latest
  tags: install
  become: true
  ansible.builtin.apt:
    name: tailscale
    state: latest
    update_cache: true
