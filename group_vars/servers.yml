---
# Hosts driven from a controller connect as the unattended account that the
# ansiblebot role provisions (see ansiblebot_user in its defaults), authenticated
# by the SSH key installed there, with passwordless sudo for the roles' become.
#
# The first run against a fresh host cannot use that account yet, because the
# ansiblebot role is what creates it. Override on the command line, which beats
# this file, and pass the admin user's sudo password prompt explicitly:
#
#     scripts/run-playbook.sh servers -- -e ansible_user=<admin> --ask-become-pass
#
# ansible-pull ignores this file: its generated inventory has no "servers"
# group, and it runs as whoever invoked it.
ansible_user: ansiblebot
