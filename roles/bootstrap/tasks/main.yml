---
# Brings a machine up to date. This role owns whole-system upgrades — every other
# role installs with state: present and leaves upgrading to this one, so running
# them cannot bump unrelated packages.
#
# Safe on any host, desktops included. The unattended account lives in the
# ansiblebot role, which only server playbooks apply.
- name: Update package index
  become: true
  ansible.builtin.package:
    update_cache: true
  changed_when: false # Don't list as a changed

- name: Upgrade all packages
  become: true
  ansible.builtin.apt:
    upgrade: 'yes'

- name: Install avahi for mDNS configurations
  become: true
  ansible.builtin.apt:
    name: avahi-daemon
    state: present
