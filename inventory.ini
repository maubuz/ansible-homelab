# Hosts these playbooks manage.
#
# An explicit localhost does not get the local connection automatically, hence
# ansible_connection; without it Ansible would try to SSH to itself.
#
# The test VM shares this same file, where its own localhost lands in
# [workstations] exactly as this machine does.

[workstations]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"

[servers]
# None yet. Two ways to manage one, both as the ansiblebot account that the
# ansiblebot role provisions; see docs/execution-model.md.
#   - Controller: add a line here (e.g. "pi4.lan") and run
#     scripts/run-playbook.sh --unattended servers
#   - Pull: the host runs ansible-pull local-server.yml itself; no entry needed
#     here.
