---
# Applies to every host in the inventory. Deliberately near-empty: values live
# with the role that uses them (roles/*/defaults/main.yml) unless they genuinely
# differ per host group.

# Public keys for the unattended account (ansiblebot role), one per controller.
# Public keys are not secret. The matching private key stays on the controller.
# Generate one with:
#     ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519_ansiblebot -C "ansiblebot@$(hostname)"
# then paste the contents of the .pub file below.
ansiblebot_keys: []
