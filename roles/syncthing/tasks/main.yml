---
# Installs Syncthing and enables it as a *user* service, so it runs as the
# person who invoked the play rather than as root.
#
# Interactive-only. The user-scope systemd task talks to the invoking user's
# systemd instance, which needs XDG_RUNTIME_DIR (/run/user/<uid>) set and that
# user to have a session — or lingering enabled, which is what the test VM does.
# Neither holds under ansible-pull as ansiblebot. See "Execution model" in the
# README.
- name: Install Syncthing
  become: true
  ansible.builtin.package:
    name: syncthing
    # present, not latest: upgrades are the bootstrap role's job.
    state: present

- name: Enable and start the Syncthing user service
  ansible.builtin.systemd_service:
    name: syncthing
    scope: user
    enabled: true
    state: started
    daemon_reload: true
