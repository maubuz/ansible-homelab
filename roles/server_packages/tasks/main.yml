---
# Baseline packages and snaps for servers. The counterpart of the desktop role,
# separate so servers never read desktop_* and a desktop-only change cannot
# reach them.
#
# state: present, not latest: whole-system upgrades belong to the bootstrap
# role, so a run here cannot bump a toolchain you did not ask for.
- name: Check the required variables are set
  ansible.builtin.assert:
    that: server_packages_apt | default([], true) | length > 0
    fail_msg: >-
      server_packages_apt is empty. It defaults to baseline_packages in
      group_vars/all.yml.
    quiet: true

- name: Install server packages
  become: true
  ansible.builtin.package:
    update_cache: true
    name: '{{ server_packages_apt }}'
    state: present

- name: Install snap packages with sandbox
  become: true
  community.general.snap:
    name: '{{ server_packages_snaps }}'
  when: server_packages_snaps | length > 0

- name: Install snap packages w/ "classic" privilege
  become: true
  community.general.snap:
    name: '{{ server_packages_snaps_classic }}'
    classic: true
  when: server_packages_snaps_classic | length > 0
