---
# Baseline workstation packages.
#
# state: present, not latest — this role means "these packages exist", not
# "upgrade them now". Whole-system upgrades belong to the bootstrap role, so a
# run here cannot surprise you with a toolchain bump you did not ask for.
- name: Install workstation packages (all linux families)
  become: true
  ansible.builtin.package:
    update_cache: true
    name: '{{ desktop_packages }}'
    state: present
  when: desktop_packages | length > 0

- name: Install specific packages (RedHat based)
  become: true
  ansible.builtin.package:
    name: '{{ desktop_packages_redhat }}'
    state: present
  when:
    - ansible_facts['os_family'] == "RedHat"
    - desktop_packages_redhat | length > 0

- name: Install specific packages (Deb based)
  become: true
  ansible.builtin.package:
    name: '{{ desktop_packages_deb }}'
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - desktop_packages_deb | length > 0

- name: Install snap packages with sandbox (Ubuntu)
  become: true
  community.general.snap:
    name: '{{ desktop_snaps }}'
  when:
    - ansible_facts['distribution'] == "Ubuntu"
    - desktop_snaps | length > 0

- name: Install snap packages w/ "classic" privilege (Ubuntu)
  become: true
  community.general.snap:
    name: '{{ desktop_snaps_classic }}'
    classic: true
  when:
    - ansible_facts['distribution'] == "Ubuntu"
    - desktop_snaps_classic | length > 0
