---
# Read-only checks of what is in effect, not of what was written. The GRUB config
# is the exception that proves it: it is what the bootloader will read.
- name: Read the effective logind lid settings
  ansible.builtin.import_tasks: lid_read.yml

- name: Assert logind uses the configured lid action
  ansible.builtin.assert:
    that:
      - item.stdout | trim == 's "' ~ server_laptop_lid_action ~ '"'
    fail_msg: "{{ item.item }} is {{ item.stdout | trim }}, expected {{ server_laptop_lid_action }}"
    quiet: true
  loop: "{{ server_laptop_logind_effective.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the sleep target state
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  loop: "{{ server_laptop_sleep_targets }}"
  register: server_laptop_sleep_state

- name: Assert the sleep targets are masked
  ansible.builtin.assert:
    that:
      - item.status.LoadState == 'masked'
    fail_msg: "{{ item.item }} is '{{ item.status.LoadState }}', expected 'masked'"
    quiet: true
  loop: "{{ server_laptop_sleep_state.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check the generated GRUB config has the wanted consoleblank
  ansible.builtin.import_tasks: grub_config_check.yml

- name: Assert the generated GRUB config has the wanted consoleblank
  ansible.builtin.assert:
    that:
      - server_laptop_grub_config_stat.stat.exists and server_laptop_grub_config_check.rc == 0
    fail_msg: >-
      {{ server_laptop_grub_config }} does not set
      consoleblank={{ server_laptop_consoleblank }}.
    quiet: true
