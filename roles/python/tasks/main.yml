---
# Owns pipx for the whole workstation sequence: gnome_extensions and
# ansible_tools both install through it, so this role runs before them.
- name: Install python related packages (Ubuntu)
  become: true
  ansible.builtin.package:
    update_cache: true
    name: [python3-pip, pipx, python3-venv, python-is-python3]
    state: present
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Ensure pipx is in path
  ansible.builtin.command:
    cmd: pipx ensurepath
  changed_when: false

- name: Install uv with pipx
  community.general.pipx:
    name: uv
    state: latest
