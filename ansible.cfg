# Repository-wide Ansible defaults.
#
# Anything run from the repository root picks these up automatically, including
# every run made through scripts/run-playbook.sh.

[defaults]
# All playbooks here target the machine they run on. Declaring localhost
# explicitly keeps "no inventory was parsed" warnings out of the logs.
inventory = inventory.ini

# Rolling, timestamped log of every run made from this repo. Per-run console
# transcripts are written separately to logs/<playbook>-<timestamp>.log.
log_path = logs/ansible.log

# Per-task durations and a total runtime, so slow or hung tasks are obvious
# when reading a log after the fact.
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer

retry_files_enabled = False
interpreter_python = auto_silent

# Ubuntu's ansible package ships community.general and ansible.posix inside its
# own dist-packages tree, which is not on the default collections search path.
# The system ansible-playbook finds them anyway; tools running from their own
# virtualenv (ansible-lint, installed via pipx) do not, and report every
# community.general task as an unresolvable module. Naming the path here fixes
# the linter without installing a second copy of the collections.
collections_path = ~/.ansible/collections:/usr/share/ansible/collections:/usr/lib/python3/dist-packages/ansible_collections

[diff]
# Always show what a task changed in a file. Essential when reviewing a run
# from its log rather than watching it live.
always = True
context = 3
