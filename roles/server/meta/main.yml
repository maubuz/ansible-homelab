---
# Everything a server gets, in order. A role that only lists dependencies, so
# playbooks/servers.yml (controller) and local-server.yml (ansible-pull) apply
# the same set and cannot drift apart.
#
# server_syncthing is deliberately not here: which hosts get Syncthing is not
# decided yet, and no playbook applies the role (docs/syncthing-server.md).
# wezterm and tailscale are plain system-wide apt installs, shared with
# workstations; the other roles have separate server versions because the
# workstation ones install into the connecting user's home.
dependencies:
  - role: bootstrap
  - role: ansiblebot
  - role: server_packages
  - role: server_python
  - role: server_node
  - role: wezterm
  - role: tailscale
