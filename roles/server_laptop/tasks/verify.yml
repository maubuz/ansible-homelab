---
# Read-only checks of what is in effect, not of what was written.
- name: Read the effective logind lid settings
  ansible.builtin.command:
    cmd: >-
      busctl get-property org.freedesktop.login1 /org/freedesktop/login1
      org.freedesktop.login1.Manager {{ item }}
  loop:
    - HandleLidSwitch
    - HandleLidSwitchExternalPower
    - HandleLidSwitchDocked
  register: server_laptop_logind_props
  changed_when: false

- name: Assert logind uses the configured lid action
  ansible.builtin.assert:
    that:
      - item.stdout | trim == 's "' ~ server_laptop_lid_action ~ '"'
    fail_msg: "{{ item.item }} is {{ item.stdout | trim }}, expected {{ server_laptop_lid_action }}"
    quiet: true
  loop: "{{ server_laptop_logind_props.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the sleep target state
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  loop: "{{ server_laptop_sleep_targets }}"
  register: server_laptop_sleep_state

- name: Assert the sleep targets are masked
  ansible.builtin.assert:
    that:
      - item.status.LoadState == 'masked'
    fail_msg: "{{ item.item }} is '{{ item.status.LoadState }}', expected 'masked'"
    quiet: true
  loop: "{{ server_laptop_sleep_state.results }}"
  loop_control:
    label: "{{ item.item }}"
