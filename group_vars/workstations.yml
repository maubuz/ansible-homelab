---
# Package lists live here rather than in the desktop role's defaults because
# they are a statement about this group of machines, not about how the role
# works. What every host type gets comes from baseline_* in all.yml; the
# *_extra_* lists are what only a desktop wants. Servers have their own role
# (server_packages) and do not read desktop_*.
desktop_packages: "{{ baseline_packages + desktop_extra_packages }}"
desktop_extra_packages:
    - gimp
    - inkscape
    - gnome-shell-extension-manager
    - flameshot
    # Used for clipboard support in neovim
    - wl-clipboard
desktop_packages_deb:
    - gnome-tweaks
desktop_snaps: "{{ baseline_snaps + desktop_extra_snaps }}"
desktop_extra_snaps:
    - chromium
    - chromium-ffmpeg
    # Snap rather than deb: the deb suite would install alongside this one rather
    # than replacing it.
    - libreoffice
    - mattermost-desktop
    - spotify
    - marktext
    - slack
desktop_snaps_classic: "{{ baseline_snaps_classic + desktop_extra_snaps_classic }}"
desktop_extra_snaps_classic:
    - code # vscode
gnome_extensions_list:
    - simple-timer@majortomvr.github.com # https://github.com/MajortomVR/simple-timer-extension
    - emoji-copy@felipeftn
    - stopwatch@aliakseiz.github.com
    - Vitals@CoreCoding.com # https://github.com/corecoding/Vitals
    - pomodoro-timer@Oguzhankokulu.github.com
    # Unused extensions: just-perfection-desktop@just-perfection
    # Failed to install but was great: system-monitor-next@paradoxxx.zero.gmail.com
