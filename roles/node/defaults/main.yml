---
node_nvm_install_url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh
node_nvm_dir: '{{ ansible_facts.env.HOME }}/.nvm'
# nvm is a shell function, so every task has to source it first.
node_nvm_load: export NVM_DIR="{{ node_nvm_dir }}" && [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
node_global_packages:
  - typescript
